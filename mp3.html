<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate"/>
  <title>Selfie Segmentation (pure MP) — clean</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#fff;font-family:system-ui}
    #wrap{position:relative;width:100vw;height:100vh;overflow:hidden}
    #bg{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 30%, #3a3a4a, #151520 60%, #0a0a12)}
    canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    video{display:none} /* ВИДЕО СКРЫТО — только как источник для MP */
    #hud{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);padding:8px 10px;border-radius:8px;font-size:14px;z-index:20}
    #controls{position:absolute;top:10px;right:10px;display:flex;gap:8px;z-index:20}
    button, label{background:rgba(0,0,0,.55);color:#fff;border:1px solid #444;border-radius:8px;padding:6px 10px;font-size:14px}
    input[type=checkbox]{vertical-align:-2px;margin-right:6px}
  </style>
  <!-- MediaPipe: utils + SelfieSegmentation (чистый MP, без TFJS) -->
  <script src="https://unpkg.com/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
  <script src="https://unpkg.com/@mediapipe/selfie_segmentation@0.1/selfie_segmentation.js"></script>
</head>
<body>
  <div id="wrap">
    <div id="bg"></div>
    <canvas id="out"></canvas>
    <video id="video" playsinline muted></video>

    <div id="hud">Loading…</div>
    <div id="controls">
      <button id="toggleCam">Use front camera</button>
      <label><input id="mirror" type="checkbox" checked> Mirror</label>
    </div>
  </div>

  <script>
    const hud = document.getElementById('hud');
    const out = document.getElementById('out');
    const ctx = out.getContext('2d');
    const video = document.getElementById('video');
    const toggleCamBtn = document.getElementById('toggleCam');
    const mirrorChk = document.getElementById('mirror');

    let useFront = true;     // стартуем с фронт. камеры (селфи)
    let camera, seg, running=false, lastT=performance.now(), frames=0, fps=0;

    function fitCanvas(){
      if (!video.videoWidth) return;
      if (out.width !== video.videoWidth || out.height !== video.videoHeight){
        out.width = video.videoWidth; out.height = video.videoHeight;
      }
    }

    function drawPerson(results){
      fitCanvas();
      ctx.clearRect(0,0,out.width,out.height);

      // фон (пока градиент div, он не рисуется на canvas; оставим чисто человека)
      // если захочешь картинку-фон:
      // const img = new Image(); img.src='bg.jpg'; ctx.drawImage(img,0,0,out.width,out.height);

      // Маска → рисуем человека с композитом
      ctx.save();
      if (mirrorChk.checked){
        ctx.translate(out.width, 0);
        ctx.scale(-1, 1); // зеркалим вывод
      }

      // 1) маска
      ctx.drawImage(results.segmentationMask, 0, 0, out.width, out.height);
      // 2) оставляем только человека
      ctx.globalCompositeOperation = 'source-in';
      ctx.drawImage(video, 0, 0, out.width, out.height);

      ctx.restore();

      // FPS
      frames++;
      const now = performance.now();
      if (now - lastT > 1000){
        fps = (frames * 1000 / (now - lastT)) | 0;
        frames = 0; lastT = now;
        hud.textContent = `Segm: ${fps} fps | MP | ${useFront?'front':'rear'} | mirror:${mirrorChk.checked?'on':'off'}`;
      }
    }

    async function setupSeg(){
      const base = 'https://unpkg.com/@mediapipe/selfie_segmentation@0.1/';
      seg = new SelfieSegmentation({ locateFile: (f)=> base + f });
      seg.setOptions({ modelSelection: 1, selfieMode: useFront }); // selfieMode = true для фронт-камеры
      seg.onResults(drawPerson);
    }

    async function startCamera(){
      // Останавливаем предыдущую камеру, если есть
      if (camera){ try{ camera.stop(); }catch{} }
      // MediaPipe helper гоняет кадры в seg.send
      camera = new Camera(video, {
        onFrame: async () => { await seg.send({ image: video }); },
        width: 1280, height: 720,
        facingMode: useFront ? 'user' : 'environment'
      });
      await camera.start();
    }

    async function boot(){
      await setupSeg();
      await startCamera();
      running = true;
    }

    // Переключатели
    toggleCamBtn.addEventListener('click', async ()=>{
      useFront = !useFront;
      toggleCamBtn.textContent = useFront ? 'Use rear camera' : 'Use front camera';
      seg.setOptions({ selfieMode: useFront });
      await startCamera();
    });

    mirrorChk.addEventListener('change', ()=> { /* перерисуем на следующем кадре */ });

    boot().catch(e=>{
      hud.textContent = 'Error: ' + e.message;
      console.error(e);
    });
  </script>
</body>
</html>
