<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate"/>
  <title>MediaPipe Segmentation — photobooth bg (feather fixed)</title>
  <style>
    html,body{margin:0;height:100%;background:#111;color:#fff;font-family:system-ui}
    #wrap{position:relative;width:100vw;height:100vh;overflow:hidden}
    canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    video{display:none}
    #hud{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);padding:8px 10px;border-radius:8px;font-size:14px;z-index:20}
    #controls{position:absolute;top:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:20;flex-wrap:wrap}
    button, label{background:rgba(0,0,0,.55);color:#fff;border:1px solid #444;border-radius:8px;padding:6px 10px;font-size:14px}
    input[type=checkbox]{vertical-align:-2px;margin-right:6px}
    input[type=range]{width:140px}
    .row{display:flex;gap:8px;align-items:center}
  </style>
  <script src="https://unpkg.com/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
  <script src="https://unpkg.com/@mediapipe/selfie_segmentation@0.1/selfie_segmentation.js"></script>
</head>
<body>
  <div id="wrap">
    <canvas id="out"></canvas>
    <video id="video" playsinline muted></video>

    <div id="hud">Loading…</div>
    <div id="controls">
      <div class="row">
        <button id="toggleCam">Use rear camera</button>
        <label><input id="mirror" type="checkbox" checked> Mirror</label>
      </div>
      <div class="row">
        <label>Feather <input id="feather" type="range" min="0" max="10" step="0.1" value="2.5"></label>
        <span id="featherVal">2.5px</span>
        <label title="Модель 1 — хуже край у крупного плана"><input id="quality" type="checkbox"> Quality 1</label>
      </div>
    </div>
  </div>

  <!-- фон (положи файл рядом с html) -->
  <img id="bgimg" src="lab_bg.jpg.png" style="display:none" crossorigin="anonymous">

  <script>
    const hud = document.getElementById('hud');
    const out = document.getElementById('out');
    const ctx = out.getContext('2d');
    const video = document.getElementById('video');
    const toggleCamBtn = document.getElementById('toggleCam');
    const mirrorChk = document.getElementById('mirror');
    const featherR = document.getElementById('feather');
    const featherVal = document.getElementById('featherVal');
    const qualityChk = document.getElementById('quality');
    const bgimg = document.getElementById('bgimg');

    // высокое сглаживание апскейла
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    let useFront = true; // старт с фронталки
    let camera, seg, fps=0, frames=0, lastT=performance.now();

    // оффскрин под маску для «пера»
    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d', { alpha:true });

    function fitCanvas(){
      if (!video.videoWidth) return;
      if (out.width !== video.videoWidth || out.height !== video.videoHeight){
        out.width = video.videoWidth; out.height = video.videoHeight;
        maskCanvas.width = out.width; maskCanvas.height = out.height;
      }
    }

    function drawBgCover(img){
      const cw = out.width, ch = out.height;
      const iw = img.naturalWidth, ih = img.naturalHeight;
      if (!iw || !ih){ ctx.fillStyle='#151520'; ctx.fillRect(0,0,cw,ch); return; }
      const s = Math.max(cw/iw, ch/ih);
      const w = iw*s, h = ih*s;
      const x = (cw - w)/2, y = (ch - h)/2;
      ctx.drawImage(img, x, y, w, h);
    }

    function drawPerson(results){
      fitCanvas();
      ctx.clearRect(0,0,out.width,out.height);

      // единый трансформ (зеркало) для ВИДЕО и МАСКИ
      ctx.save();
      if (mirrorChk.checked){ ctx.translate(out.width, 0); ctx.scale(-1,1); }

      // 1) кладём исходное видео
      ctx.drawImage(video, 0, 0, out.width, out.height);

      // 2) готовим маску с «пером» на оффскрине
      const f = parseFloat(featherR.value)||0;
      featherVal.textContent = f.toFixed(1) + 'px';
      maskCtx.clearRect(0,0,maskCanvas.width,maskCanvas.height);
      maskCtx.imageSmoothingEnabled = true;
      maskCtx.imageSmoothingQuality = 'high';
      // цепочка фильтров: размытие + легкая контрастность для более четкой границы
      maskCtx.filter = f>0 ? `blur(${f}px) contrast(180%)` : 'none';
      maskCtx.drawImage(results.segmentationMask, 0, 0, maskCanvas.width, maskCanvas.height);
      maskCtx.filter = 'none';

      // 3) вырезаем фон по маске (оставляем человека)
      ctx.globalCompositeOperation = 'destination-in';
      ctx.drawImage(maskCanvas, 0, 0);

      // завершаем зеркальный трансформ
      ctx.restore();

      // 4) фон под человеком
      ctx.globalCompositeOperation = 'destination-over';
      if (bgimg.complete) drawBgCover(bgimg);
      else { ctx.fillStyle='#151520'; ctx.fillRect(0,0,out.width,out.height); }

      // HUD
      frames++; const now=performance.now();
      if (now-lastT>1000){
        fps = (frames*1000/(now-lastT))|0; frames=0; lastT=now;
        hud.textContent = `Segm: ${fps} fps | MP | ${useFront?'front':'rear'} | mirror:${mirrorChk.checked?'on':'off'} | feather:${f.toFixed(1)}px | Q:${qualityChk.checked?1:0}`;
      }
    }

    async function setupSeg(){
      const base = 'https://unpkg.com/@mediapipe/selfie_segmentation@0.1/';
      seg = new SelfieSegmentation({ locateFile: (f)=> base + f });
      // ВАЖНО: selfieMode выключен — зеркалим сами
      seg.setOptions({ modelSelection: qualityChk.checked ? 1 : 0, selfieMode: false });
      seg.onResults(drawPerson);
    }

    async function startCamera(){
      if (camera){ try{ camera.stop(); }catch{} }
      camera = new Camera(video, {
        onFrame: async () => { await seg.send({ image: video }); },
        width: 1280, height: 720,
        facingMode: useFront ? 'user' : 'environment'
      });
      await camera.start();
    }

    async function boot(){
      await setupSeg();
      await startCamera();
    }

    toggleCamBtn.addEventListener('click', async ()=>{
      useFront = !useFront;
      toggleCamBtn.textContent = useFront ? 'Use rear camera' : 'Use front camera';
      await startCamera();
    });

    mirrorChk.addEventListener('change', ()=>{});
    featherR.addEventListener('input', ()=>{});       // значение читаем в кадре
    qualityChk.addEventListener('change', async ()=>{ await setupSeg(); });

    boot().catch(e=>{ hud.textContent='Error: '+e.message; console.error(e); });
  </script>
</body>
</html>
